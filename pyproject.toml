[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-incident-intelligence"
version = "0.1.0"
description = "AI-powered incident analysis platform for microservices"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Platform Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "sqlalchemy>=2.0.32",
    "asyncpg>=0.29.0",
    "alembic>=1.13.2",
    "aiokafka>=0.11.0",
    "redis>=5.0.8",
    "qdrant-client>=1.10.1",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.30",
    "sentence-transformers>=3.0.1",
    "hdbscan>=0.8.38.post2",
    "networkx>=3.3",
    "httpx>=0.27.0",
    "python-json-logger>=2.0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.5.7",
    "mypy>=1.11.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "services*", "shared*", "scripts*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
