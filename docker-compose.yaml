name: ai-incident-platform

services:
  postgres:
    image: postgres:${POSTGRES_VERSION:-18}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_db}
      POSTGRES_USER: ${POSTGRES_USER:-ayush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayushshah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayush} -d ${POSTGRES_DB:-incident_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:${REDIS_VERSION:-latest}
    container_name: redis
    restart: unless-stopped
    command: redis-server
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-latest}
    container_name: kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_FLUSH_INTERVAL_MESSAGES: 10000
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  qdrant:
    image: qdrant/qdrant:${QDRANT_VERSION:-latest}
    container_name: qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 1. API Gateway Microservice
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    container_name: gateway
    restart: unless-stopped
    ports:
      - "${GATEWAY_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      SERVICE_NAME: gateway
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      ORDERS_SERVICE_URL: http://orders:8002
      PAYMENTS_SERVICE_URL: http://payments:8003
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 2. Orders Microservice
  orders:
    build:
      context: .
      dockerfile: services/orders/Dockerfile
    container_name: orders
    restart: unless-stopped
    ports:
      - "${ORDERS_PORT:-8002}:8002"
    env_file:
      - .env
    environment:
      SERVICE_NAME: orders
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      INVENTORY_SERVICE_URL: http://inventory:8004
      NOTIFICATIONS_SERVICE_URL: http://notifications:8005
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 3. Inventory Microservice
  inventory:
    build:
      context: .
      dockerfile: services/inventory/Dockerfile
    container_name: inventory
    restart: unless-stopped
    ports:
      - "${INVENTORY_PORT:-8004}:8004"
    env_file:
      - .env
    environment:
      SERVICE_NAME: inventory
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 4. Payments Microservice
  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    container_name: payments
    restart: unless-stopped
    ports:
      - "${PAYMENTS_PORT:-8003}:8003"
    env_file:
      - .env
    environment:
      SERVICE_NAME: payments
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOTIFICATIONS_SERVICE_URL: http://notifications:8005
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # 5. Notifications Microservice
  notifications:
    build:
      context: .
      dockerfile: services/notifications/Dockerfile
    container_name: notifications
    restart: unless-stopped
    ports:
      - "${NOTIFICATIONS_PORT:-8005}:8005"
    env_file:
      - .env
    environment:
      SERVICE_NAME: notifications
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Platform Backend Service (Health & Readiness in Stage 1)
  backend:
    image: ai-incident-platform-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TARGET_DEVICE: ${TARGET_DEVICE:-cu132}
    container_name: incident-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      SERVICE_NAME: backend
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ayush}:${POSTGRES_PASSWORD:-ayushshah}@postgres:5432/${POSTGRES_DB:-incident_db}
      REDIS_URL: redis://redis:6379/0
      QDRANT_HOST: qdrant
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./services:/app/services:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: ${GPU_DRIVER:-nvidia}
              count: ${GPU_COUNT:-all}
              capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Celery Asynchronous Worker (Stage 2 Incident Clustering)
  celery-worker:
    image: ai-incident-platform-backend
    container_name: celery-worker
    restart: unless-stopped
    command: celery -A backend.tasks.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    environment:
      SERVICE_NAME: celery-worker
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ayush}:${POSTGRES_PASSWORD:-ayushshah}@postgres:5432/${POSTGRES_DB:-incident_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_HOST: qdrant
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - app-network

  # Streaming Kafka Batch Consumer (Stage 2 Ingestion)
  clustering-consumer:
    image: ai-incident-platform-backend
    container_name: clustering-consumer
    restart: unless-stopped
    command: python -m backend.kafka.clustering_consumer
    env_file:
      - .env
    environment:
      SERVICE_NAME: clustering-consumer
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network

  # Test Runner Service (For executing integration test suite inside Docker)
  test-runner:
    image: ai-incident-platform-backend
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        TARGET_DEVICE: ${TARGET_DEVICE:-cu132}
    container_name: test-runner
    env_file:
      - .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      GATEWAY_URL: http://gateway:8001
      ORDERS_SERVICE_URL: http://orders:8002
      PAYMENTS_SERVICE_URL: http://payments:8003
      INVENTORY_SERVICE_URL: http://inventory:8004
      NOTIFICATIONS_SERVICE_URL: http://notifications:8005
      BACKEND_URL: http://backend:8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-ayush}:${POSTGRES_PASSWORD:-ayushshah}@postgres:5432/${POSTGRES_DB:-incident_db}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      QDRANT_HOST: qdrant
    volumes:
      - ./tests:/app/tests
      - ./shared:/app/shared
      - ./services:/app/services
      - ./backend:/app/backend
      - ./scripts:/app/scripts
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - app-network
    profiles:
      - test

networks:
  app-network:
    driver: bridge

volumes:
  qdrant_data: